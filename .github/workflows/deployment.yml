name: Deployment

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

env:
  PLATFORM: azure

jobs:
  foundation:
    environment: dev
    name: Foundation deployment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        if: ${{ env.PLATFORM == 'azure' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init
        working-directory: terraform/azure/foundation

      - name: Terraform plan
        run: terraform plan -out=foundation.tfplan
        working-directory: terraform/azure/foundation

      - name: Terraform apply
        run: terraform apply foundation.tfplan
        working-directory: terraform/azure/foundation